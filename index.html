// ── CSV Parsers ───────────────────────────────────────────────────────────────
function parseChaseCSV(text) {
  const lines = text.trim().split("\n").filter(l => l.trim());
  if (lines.length < 2) return [];
  const delim = lines[0].includes("\t") ? "\t" : ",";
  const results = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = delim === "\t" ? lines[i].split("\t") : parseCSVLine(lines[i]);
    if (cols.length < 4) continue;
    const date = cols[0]?.trim();
    const desc = cols[2]?.trim() || cols[1]?.trim();
    const amtRaw = cols[5]?.trim() || cols[4]?.trim() || cols[3]?.trim();
    if (!date || !desc || !amtRaw) continue;
    const amount = parseFloat(amtRaw.replace(/[$,]/g, ""));
    if (isNaN(amount)) continue;
    results.push({ date, description: desc, amount: -amount });
  }
  return results;
}

function parseCapitalOneCSV(text) {
  const lines = text.trim().split("\n").filter(l => l.trim());
  const results = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = parseCSVLine(lines[i]);
    if (cols.length < 5) continue;
    const date = cols[0]?.trim();
    const desc = cols[3]?.trim() || cols[2]?.trim();
    const debit = parseFloat((cols[5] || cols[4] || "").replace(/[$,]/g, ""));
    const credit = parseFloat((cols[6] || "").replace(/[$,]/g, ""));
    if (!date || !desc) continue;
    const amount = !isNaN(debit) && debit > 0 ? debit : (!isNaN(credit) && credit > 0 ? -credit : null);
    if (amount === null) continue;
    results.push({ date, description: desc, amount });
  }
  return results;
}

function parseAlliantCSV(text) {
  const lines = text.trim().split("\n").filter(l => l.trim());
  const results = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = parseCSVLine(lines[i]);
    if (cols.length < 3) continue;
    const date = cols[0]?.trim();
    const desc = cols[1]?.trim();
    const amtRaw = cols[2]?.trim();
    if (!date || !desc || !amtRaw) continue;
    const amount = parseFloat(amtRaw.replace(/[$,]/g, ""));
    if (isNaN(amount)) continue;
    if (amount >= 0) continue; // skip deposits
    results.push({ date, description: desc, amount: -amount });
  }
  return results;
}

function parseCSVLine(line) {
  const result = [];
  let cur = "", inQ = false;
  for (let i = 0; i < line.length; i++) {
    if (line[i] === '"') { inQ = !inQ; }
    else if (line[i] === ',' && !inQ) { result.push(cur); cur = ""; }
    else cur += line[i];
  }
  result.push(cur);
  return result;
}

function autoDetectParser(text) {
  const first = text.split("\n")[0].toLowerCase();
  if (first.includes("transaction date") || first.includes("post date")) return parseChaseCSV;
  if (first.includes("card no") || first.includes("card num")) return parseCapitalOneCSV;
  if (first.includes("alliant") || first.includes("balance")) return parseAlliantCSV;
  return parseChaseCSV; // default
}

function autoCategorize(desc) {
  const d = desc.toLowerCase();
  for (const cat of CATEGORIES) {
    if (cat.keywords.some(k => d.includes(k))) return cat.id;
  }
  return "other";
}

function autoTag(desc) {
  const d = desc.toLowerCase();
  if (AUTO_SUBSCRIPTION_KEYWORDS.some(k => d.includes(k))) return "subscription";
  if (AUTO_REQUIRED_KEYWORDS.some(k => d.includes(k))) return "required";
  return "other";
}

// ── useCloud hook ─────────────────────────────────────────────────────────────
function useCloud(table, def = []) {
  const [data, setData] = useState(def);
  const [loaded, setLoaded] = useState(false);
  useEffect(() => {
    db.get(table).then(rows => { if (rows.length) setData(rows); setLoaded(true); }).catch(() => setLoaded(true));
  }, [table]);
  const save = useCallback(async (item) => {
    const id = item.id || Date.now();
    const withId = { ...item, id };
    await db.upsert(table, id, withId);
    setData(prev => { const ex = prev.find(x => x.id === withId.id); return ex ? prev.map(x => x.id === withId.id ? withId : x) : [...prev, withId]; });
    return withId;
  }, [table]);
  const remove = useCallback(async (id) => { await db.delete(table, id); setData(prev => prev.filter(x => x.id !== id)); }, [table]);
  const update = useCallback(async (id, changes) => {
    setData(prev => {
      const item = prev.find(x => x.id === id);
      if (!item) return prev;
      const updated = { ...item, ...changes };
      db.upsert(table, id, updated);
      return prev.map(x => x.id === id ? updated : x);
    });
  }, [table]);
  return [data, save, remove, update, loaded];
}

// ── Breakdown ─────────────────────────────────────────────────────────────────
function Breakdown({ txns }) {
  const total = txns.reduce((s, t) => s + (t.amount > 0 ? t.amount : 0), 0);

  const byTag = TAGS.map(tag => {
    const sum = txns.filter(t => t.tag === tag.id && t.amount > 0).reduce((s, t) => s + t.amount, 0);
    return { ...tag, sum, pct: total ? (sum / total * 100).toFixed(1) : 0 };
  }).filter(t => t.sum > 0);

  const byCat = CATEGORIES.map(cat => {
    const sum = txns.filter(t => t.category === cat.id && t.amount > 0).reduce((s, t) => s + t.amount, 0);
    return { ...cat, sum, pct: total ? (sum / total * 100).toFixed(1) : 0 };
  }).filter(c => c.sum > 0).sort((a, b) => b.sum - a.sum);

  const byAccount = ACCOUNTS.map(acc => {
    const sum = txns.filter(t => t.account === acc.id && t.amount > 0).reduce((s, t) => s + t.amount, 0);
    return { ...acc, sum, pct: total ? (sum / total * 100).toFixed(1) : 0 };
  }).filter(a => a.sum > 0);

  const StatBar = ({ label, emoji, color, sum, pct }) => (
    <div style={{ marginBottom: 12 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>

        <span style={{ fontSize: 13, fontWeight: 600, color: p.text }}>{fmt(sum)} <span style={{ color: p.muted, fontWeight: 400 }}>({pct}%)</span></span>
      </div>
      <div style={{ background: p.border, borderRadius: 4, height: 8 }}>
        <div className="bar" style={{ width: `${pct}%`, background: color }} />
      </div>
    </div>
  );

  return (
    <div>
      <div className="stat-card" style={{ marginBottom: 12 }}>
        <div style={{ fontSize: 12, color: p.muted, marginBottom: 4, textTransform: "uppercase", letterSpacing: ".5px" }}>Total Spending</div>
        <div style={{ fontSize: 28, fontWeight: 700, color: p.text }}>{fmt(total)}</div>
        <div style={{ fontSize: 12, color: p.muted, marginTop: 2 }}>{txns.length} transactions</div>
      </div>

      {byTag.length > 0 && (
        <div className="stat-card" style={{ marginBottom: 12 }}>
          <div style={{ fontSize: 13, fontWeight: 600, color: p.textMuted, marginBottom: 14, textTransform: "uppercase", letterSpacing: ".5px" }}>By Spending Type</div>
          {byTag.map(t => <StatBar key={t.id} label={t.label} emoji={t.emoji} color={t.color} sum={t.sum} pct={t.pct} />)}
        </div>
      )}

      {byCat.length > 0 && (
        <div className="stat-card" style={{ marginBottom: 12 }}>
          <div style={{ fontSize: 13, fontWeight: 600, color: p.textMuted, marginBottom: 14, textTransform: "uppercase", letterSpacing: ".5px" }}>By Category</div>
          {byCat.map(c => <StatBar key={c.id} label={c.name} emoji={c.emoji} color={c.color} sum={c.sum} pct={c.pct} />)}
        </div>
      )}

      {byAccount.length > 0 && (
        <div className="stat-card" style={{ marginBottom: 12 }}>
          <div style={{ fontSize: 13, fontWeight: 600, color: p.textMuted, marginBottom: 14, textTransform: "uppercase", letterSpacing: ".5px" }}>By Account</div>
          {byAccount.map(a => <StatBar key={a.id} label={a.name} emoji="💳" color={a.color} sum={a.sum} pct={a.pct} />)}

  const [filterAccount, setFilterAccount] = useState("all");

  // Upload state
  const [uploadAccount, setUploadAccount] = useState("jessica_chase");
  const [uploadPreview, setUploadPreview] = useState([]);
  const [dragOver, setDragOver] = useState(false);
  const [uploadMsg, setUploadMsg] = useState("");

  // Cash form
  const [cashForm, setCashForm] = useState({ date: today(), description: "", amount: "", category: "other", tag: "other", notes: "" });

  const withSync = async (fn) => { setSyncing(true); try { await fn(); } finally { setSyncing(false); } };

  function filterTxns(list) {
    let filtered = list;
    if (filterAccount !== "all") filtered = filtered.filter(t => t.account === filterAccount);
    if (view === 0) filtered = filtered.filter(t => { const d = new Date(t.date); return d.getMonth() === selMonth && d.getFullYear() === selYear; });
    else if (view === 1) filtered = filtered.filter(t => new Date(t.date).getFullYear() === selYear);
    else if (view === 2 && customStart && customEnd) filtered = filtered.filter(t => t.date >= customStart && t.date <= customEnd);
    return filtered;
  }

  const filtered = filterTxns(allTxns);

  function processCSV(text, accountId) {
    const parser = autoDetectParser(text);
    const rows = parser(text);
    return rows.map(r => ({
      id: `${accountId}_${r.date}_${r.description.slice(0,20)}_${Math.random().toString(36).slice(2,6)}`,
      date: r.date,
      description: r.description,
      amount: r.amount,
      account: accountId,
      category: autoCategorize(r.description),
      tag: autoTag(r.description),
      notes: "",
    }));
  }

  function handleFile(file) {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const rows = processCSV(e.target.result, uploadAccount);
        setUploadPreview(rows);
        setUploadMsg(`Found ${rows.length} transactions. Review below then click Import.`);
      } catch(err) {
        setUploadMsg("Could not read file. Make sure it's a CSV from your bank.");
      }
    };
    reader.readAsText(file);
  }

  async function importAll() {
    setSyncing(true);
    for (const row of uploadPreview) await saveTxn(row);
    setSyncing(false);
    setUploadPreview([]);
    setUploadMsg(`✅ Imported ${uploadPreview.length} transactions!`);
    setTab(0);
  }

  const years = [];
  const minYear = allTxns.length ? Math.min(...allTxns.map(t => new Date(t.date).getFullYear())) : now.getFullYear();
  for (let y = minYear; y <= now.getFullYear() + 1; y++) years.push(y);

  return (
    <>
      <style>{css}</style>
      <div style={{ minHeight: "100vh", background: p.bg }}>

        {/* Header */}
        <div style={{ background: p.surface, borderBottom: `1px solid ${p.border}`, padding: "14px 16px" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ fontSize: 20, fontWeight: 700, color: p.text }}>💰 Budget Tracker</div>
              <div style={{ fontSize: 11, color: p.muted, marginTop: 1, letterSpacing: "1px", textTransform: "uppercase" }}>Household Spending</div>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11 }}>
              <span className="sync-dot" style={{ background: syncing ? p.amber : p.green }}></span>
              <span style={{ color: p.muted }}>{syncing ? "Saving…" : "Synced"}</span>
            </div>
          </div>
        </div>

        {/* Tabs */}
        <div style={{ display: "flex", background: p.surface, borderBottom: `1px solid ${p.border}`, overflowX: "auto" }}>
          {TABS.map((t, i) => (
            <button key={i} onClick={() => setTab(i)} style={{ padding: "10px 13px", fontSize: 12, fontWeight: 500, whiteSpace: "nowrap", background: "none", border: "none", borderBottom: tab === i ? `2px solid ${p.accent}` : "2px solid transparent", color: tab === i ? p.accent : p.muted, transition: "all .15s" }}>{t}</button>
          ))}
        </div>

        {/* Time & Account Filters — show on Transactions & Breakdown */}
        {(tab === 0 || tab === 1) && (
          <div style={{ background: p.surface, borderBottom: `1px solid ${p.border}`, padding: "10px 16px" }}>
            {/* View selector */}
            <div style={{ display: "flex", gap: 6, overflowX: "auto", marginBottom: 8 }}>
              {VIEWS.map((v, i) => (
                <button key={i} className="view-btn" onClick={() => setView(i)}
                  style={{ background: view === i ? p.accent : "none", borderColor: view === i ? p.accent : p.border, color: view === i ? "#fff" : p.muted }}>
                  {v}
                </button>
              ))}
            </div>

            {/* Month picker */}
            {view === 0 && (
              <div style={{ display: "flex", gap: 8 }}>
                <select value={selMonth} onChange={e => setSelMonth(+e.target.value)} style={{ flex: 1 }}>
                  {Array.from({ length: 12 }, (_, i) => <option key={i} value={i}>{monthName(i)}</option>)}
                </select>
                <select value={selYear} onChange={e => setSelYear(+e.target.value)} style={{ flex: 1 }}>
                  {years.map(y => <option key={y}>{y}</option>)}
                </select>
              </div>
            )}

            {/* Year picker */}
            {view === 1 && (
              <select value={selYear} onChange={e => setSelYear(+e.target.value)}>
                {years.map(y => <option key={y}>{y}</option>)}
              </select>
            )}

            {/* Custom range */}
            {view === 2 && (
              <div style={{ display: "grid", gridTemplateColumns: "1fr auto 1fr", gap: 8, alignItems: "center" }}>
                <input type="date" value={customStart} onChange={e => setCustomStart(e.target.value)} />
                <span style={{ color: p.muted, fontSize: 13 }}>→</span>
                <input type="date" value={customEnd} onChange={e => setCustomEnd(e.target.value)} />
              </div>
            )}

            {/* Account filter */}
            <div style={{ marginTop: 8 }}>
              <select value={filterAccount} onChange={e => setFilterAccount(e.target.value)}>
                <option value="all">All Accounts</option>
                {ACCOUNTS.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
              </select>
            </div>
          </div>
        )}

        <div style={{ padding: "14px 16px", maxWidth: 600, margin: "0 auto" }}>

          {/* TRANSACTIONS */}
          {tab === 0 && (
            <div>
              <div style={{ fontSize: 12, color: p.muted, marginBottom: 10 }}>
                {filtered.length} transactions · {fmt(filtered.filter(t=>t.amount>0).reduce((s,t)=>s+t.amount,0))} spent
              </div>
              {!txnsLoaded && <div style={{ textAlign: "center", color: p.muted, padding: "40px 0" }}>Loading…</div>}
              {txnsLoaded && filtered.length === 0 && (
                <div style={{ textAlign: "center", padding: "40px 0" }}>
                  <div style={{ fontSize: 36, marginBottom: 8 }}>💳</div>
                  <div style={{ color: p.muted, fontSize: 14 }}>No transactions for this period</div>
                  <div style={{ color: p.muted, fontSize: 12, marginTop: 4 }}>Upload a CSV or add a cash transaction</div>
                </div>
              )}
              {filtered.map(t => (
                <TxnRow key={t.id} txn={t}
                  onUpdate={(id, changes) => withSync(() => t.account === "cash" || cashTxns.find(c=>c.id===id) ? updateCash(id, changes) : updateTxn(id, changes))}
                  onDelete={(id) => withSync(() => cashTxns.find(c=>c.id===id) ? deleteCash(id) : deleteTxn(id))}
                />
              ))}
            </div>
          )}

          {/* BREAKDOWN */}
          {tab === 1 && <Breakdown txns={filtered} />}

          {/* ADD CASH */}
          {tab === 2 && (
            <div>
              <div style={{ fontSize: 13, color: p.muted, marginBottom: 14 }}>Log a cash purchase or manual transaction</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                <div><Label>Date</Label><input type="date" value={cashForm.date} onChange={e => setCashForm(p => ({...p, date: e.target.value}))} /></div>
                <div><Label>Description</Label><input placeholder="What was it?" value={cashForm.description} onChange={e => setCashForm(p => ({...p, description: e.target.value}))} /></div>
                <div><Label>Amount ($)</Label><input type="number" placeholder="0.00" step="0.01" value={cashForm.amount} onChange={e => setCashForm(p => ({...p, amount: e.target.value}))} /></div>
                <div><Label>Category</Label>
                  <select value={cashForm.category} onChange={e => setCashForm(p => ({...p, category: e.target.value}))}>
                    {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.emoji} {c.name}</option>)}
                  </select>
                </div>
                <div><Label>Tag</Label><TagButtons value={cashForm.tag} onChange={v => setCashForm(p => ({...p, tag: v}))} /></div>
                <div><Label>Notes</Label><textarea placeholder="Optional notes..." value={cashForm.notes} onChange={e => setCashForm(p => ({...p, notes: e.target.value}))} /></div>
                <button onClick={async () => {
                  if (!cashForm.description || !cashForm.amount) return;
                  await withSync(() => saveCash({ ...cashForm, id: Date.now(), account: "cash", amount: parseFloat(cashForm.amount) }));
                  setCashForm({ date: today(), description: "", amount: "", category: "other", tag: "other", notes: "" });
                  setTab(0);
                }} style={{ background: p.accent, color: "#fff", border: "none", borderRadius: 8, padding: "12px", fontSize: 14, fontWeight: 600 }}>
                  Save Transaction
                </button>
              </div>
            </div>
          )}

          {/* UPLOAD */}
          {tab === 3 && (
            <div>
              <div style={{ marginBottom: 12 }}>
                <Label>Account</Label>
                <select value={uploadAccount} onChange={e => setUploadAccount(e.target.value)}>
                  {ACCOUNTS.filter(a => a.id !== "cash").map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                </select>
              </div>

              <div
                className={`drop-zone${dragOver ? " drag-over" : ""}`}
                onClick={() => { const el = document.getElementById("csv-input"); el.value=""; el.click(); }}
                onDragOver={e => { e.preventDefault(); setDragOver(true); }}
                onDragLeave={() => setDragOver(false)}
                onDrop={e => { e.preventDefault(); setDragOver(false); const f = e.dataTransfer.files[0]; if (f) handleFile(f); }}
              >
                <div style={{ fontSize: 36, marginBottom: 8 }}>📂</div>
                <div style={{ color: p.text, fontSize: 14, fontWeight: 500 }}>Drop CSV file here</div>
                <div style={{ color: p.muted, fontSize: 12, marginTop: 4 }}>or tap to browse</div>
                <input id="csv-input" type="file" accept=".csv" style={{ display: "none" }} onChange={e => { if (e.target.files[0]) handleFile(e.target.files[0]); }} />
              </div>

              {uploadMsg && (
                <div style={{ marginTop: 12, padding: "10px 14px", background: p.card, borderRadius: 8, fontSize: 13, color: p.textMuted, border: `1px solid ${p.border}` }}>
                  {uploadMsg}
                </div>
              )}

              {uploadPreview.length > 0 && (
                <div style={{ marginTop: 14 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                    <div style={{ fontSize: 13, color: p.muted }}>{uploadPreview.length} transactions to import</div>
                    <div style={{ display: "flex", gap: 8 }}>
                      <button onClick={() => { setUploadPreview([]); setUploadMsg(""); }} style={{ background: "none", border: `1px solid ${p.border}`, color: p.muted, borderRadius: 6, padding: "6px 12px", fontSize: 12 }}>Cancel</button>
                      <button onClick={importAll} style={{ background: p.accent, color: "#fff", border: "none", borderRadius: 6, padding: "6px 14px", fontSize: 12, fontWeight: 600 }}>Import All</button>
                    </div>
                  </div>
                  <div style={{ maxHeight: 400, overflowY: "auto" }} className="scrollbar">
                    {uploadPreview.map((t, i) => (
                      <div key={i} style={{ background: p.card, border: `1px solid ${p.border}`, borderRadius: 8, padding: "10px 12px", marginBottom: 6 }}>
                        <div style={{ display: "flex", justifyContent: "space-between" }}>
                          <span style={{ fontSize: 13, color: p.text, flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{t.description}</span>
                          <span style={{ fontSize: 13, fontWeight: 600, color: p.red, flexShrink: 0, marginLeft: 8 }}>{fmt(t.amount)}</span>
                        </div>
                        <div style={{ display: "flex", gap: 6, marginTop: 4, flexWrap: "wrap" }}>
                          <span style={{ fontSize: 11, color: p.muted }}>{t.date}</span>
                          <CategoryPill catId={t.category} />
                          <TagPill tagId={t.tag} />
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <div style={{ marginTop: 20, background: p.card, borderRadius: 10, padding: 14, border: `1px solid ${p.border}` }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: p.textMuted, marginBottom: 8 }}>How to download your CSV</div>
                <div style={{ fontSize: 12, color: p.muted, lineHeight: 1.7 }}>
                  <div style={{ marginBottom: 6 }}><strong style={{ color: p.textMuted }}>Chase:</strong> chase.com → Accounts → Download → CSV</div>
                  <div style={{ marginBottom: 6 }}><strong style={{ color: p.textMuted }}>Capital One:</strong> capitalone.com → Account → Download Transactions → CSV</div>
                  <div><strong style={{ color: p.textMuted }}>Alliant:</strong> alliantcreditunion.org → Accounts → Export → CSV</div>
                </div>
              </div>
            </div>
          )}

        </div>
      </div>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<BudgetTracker />);
  </script>
</body>
</html>
