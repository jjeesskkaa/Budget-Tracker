// Extract first word of merchant as root for matching
function cleanMerchant(desc) {
  let d = desc.toUpperCase().trim();
  d = d.replace(/^[A-Z]{1,4}\*\s*/, "");    // remove TST* SQ* type prefixes
  d = d.replace(/#[\w\d]*/g, "");            // remove #12345 suffixes
  d = d.replace(/\*[\w\d]*/g, "");           // remove *AB123 suffixes
  // Take the very first word only
  const first = d.split(/[\s#\*\/]+/)[0].trim();
  return first || desc.slice(0, 6).toUpperCase();
}

// Match: does either description's first word contain the other?
function merchantMatch(descA, descB) {
  const a = cleanMerchant(descA);
  const b = cleanMerchant(descB);
  return a === b || a.startsWith(b) || b.startsWith(a);
}

// ── CSV Parsers ───────────────────────────────────────────────────────────────
function parseChaseCSV(text) {
  const lines = text.trim().split("\n").filter(l => l.trim());
  if (lines.length < 2) return [];
  const delim = lines[0].includes("\t") ? "\t" : ",";
  const results = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = delim === "\t" ? lines[i].split("\t") : parseCSVLine(lines[i]);
    if (cols.length < 4) continue;
    const date = cols[0]?.trim();
    const desc = cols[2]?.trim() || cols[1]?.trim();
    const amtRaw = cols[5]?.trim() || cols[4]?.trim() || cols[3]?.trim();
    if (!date || !desc || !amtRaw) continue;
    const amount = parseFloat(amtRaw.replace(/[$,]/g, ""));
    if (isNaN(amount)) continue;
    results.push({ date, description: desc, amount: -amount });
  }
  return results;
}

function parseCapitalOneCSV(text) {
  const lines = text.trim().split("\n").filter(l => l.trim());
  if (lines.length < 2) return [];
  const delim = lines[0].includes("\t") ? "\t" : ",";
  const results = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = delim === "\t" ? lines[i].split("\t") : parseCSVLine(lines[i]);
    if (cols.length < 5) continue;
    // Tab format: Transaction Date, Posted Date, Card No., Description, Category, Debit, Credit
    const date = cols[0]?.trim();
    const desc = cols[3]?.trim() || cols[2]?.trim();
    const debitRaw = cols[5]?.trim() || "";
    const creditRaw = cols[6]?.trim() || "";
    if (!date || !desc) continue;
    const debit = parseFloat(debitRaw.replace(/[$,]/g, ""));
    const credit = parseFloat(creditRaw.replace(/[$,]/g, ""));
    // Debit = money spent (positive amount), Credit = payment/refund (skip or negative)
    if (!isNaN(debit) && debit > 0) {
      results.push({ date, description: desc, amount: debit });
    } else if (!isNaN(credit) && credit > 0) {
      // Credits are refunds — include as negative (money back)
      results.push({ date, description: desc, amount: -credit });
    }
  }
  return results;
}

function parseAlliantCSV(text) {
  const lines = text.trim().split("\n").filter(l => l.trim());
  const results = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = parseCSVLine(lines[i]);
    if (cols.length < 3) continue;
    const date = cols[0]?.trim();
    const desc = cols[1]?.trim();
    const amtRaw = cols[2]?.trim();
    if (!date || !desc || !amtRaw) continue;
    const amount = parseFloat(amtRaw.replace(/[$,]/g, ""));
    if (isNaN(amount)) continue;
    if (amount >= 0) continue; // skip deposits
    results.push({ date, description: desc, amount: -amount });
  }
  return results;
}

function parseCSVLine(line) {
  const result = [];
  let cur = "", inQ = false;
  for (let i = 0; i < line.length; i++) {
    if (line[i] === '"') { inQ = !inQ; }
    else if (line[i] === ',' && !inQ) { result.push(cur); cur = ""; }
    else cur += line[i];
  }
  result.push(cur);
  return result;
}

function autoDetectParser(text) {
  const first = text.split("\n")[0].toLowerCase();
  if (first.includes("card no")) return parseCapitalOneCSV;
  if (first.includes("transaction date") && first.includes("post date") && !first.includes("card no")) return parseChaseCSV;
  if (first.includes("alliant") || first.includes("balance")) return parseAlliantCSV;
  if (first.includes("posted date") || first.includes("card num")) return parseCapitalOneCSV;
  return parseChaseCSV; // default
}

// ── useCloud hook ─────────────────────────────────────────────────────────────
function useCloud(table, def = []) {
  const [data, setData] = useState(def);
  const [loaded, setLoaded] = useState(false);
  useEffect(() => {
    db.get(table).then(rows => { if (rows.length) setData(rows); setLoaded(true); }).catch(() => setLoaded(true));
  }, [table]);
  const save = useCallback(async (item) => {
    const id = item.id || Date.now();
    const withId = { ...item, id };
    await db.upsert(table, id, withId);
    setData(prev => { const ex = prev.find(x => x.id === withId.id); return ex ? prev.map(x => x.id === withId.id ? withId : x) : [...prev, withId]; });
    return withId;
  }, [table]);
  const remove = useCallback(async (id) => { await db.delete(table, id); setData(prev => prev.filter(x => x.id !== id)); }, [table]);
  const update = useCallback(async (id, changes) => {
    setData(prev => {
      const item = prev.find(x => x.id === id);
      if (!item) return prev;
      const updated = { ...item, ...changes };
      db.upsert(table, id, updated);
      return prev.map(x => x.id === id ? updated : x);
    });
  }, [table]);
  const reload = useCallback(async () => {
    const rows = await db.get(table);
    if (rows.length) setData(rows);
  }, [table]);
  return [data, save, remove, update, loaded, reload];
}

    const sum = txns.filter(t => t.tag === tag.id && t.amount > 0).reduce((s, t) => s + t.amount, 0);
    const items = txns.filter(t => t.tag === tag.id && t.amount > 0);
    return { ...tag, sum, pct: total ? +(sum / total * 100).toFixed(1) : 0, items };
  }).filter(t => t.sum > 0).sort((a,b) => b.sum - a.sum);

  const byAccount = ACCOUNTS.map(acc => {
    const sum = txns.filter(t => t.account === acc.id && t.amount > 0).reduce((s, t) => s + t.amount, 0);
    const items = txns.filter(t => t.account === acc.id && t.amount > 0);
    return { ...acc, sum, pct: total ? +(sum / total * 100).toFixed(1) : 0, items };
  }).filter(a => a.sum > 0).sort((a,b) => b.sum - a.sum);

  // ── Pie Chart SVG ──
  function PieChart({ data }) {
    const size = 200;
    const cx = size / 2, cy = size / 2, r = 80;
    let angle = -Math.PI / 2;
    const slices = data.map(d => {
      const sweep = (d.pct / 100) * 2 * Math.PI;
      const x1 = cx + r * Math.cos(angle);
      const y1 = cy + r * Math.sin(angle);
      angle += sweep;
      const x2 = cx + r * Math.cos(angle);
      const y2 = cy + r * Math.sin(angle);
      const large = sweep > Math.PI ? 1 : 0;
      return { ...d, x1, y1, x2, y2, large, sweep };
    });
    return (
      <svg viewBox={`0 0 ${size} ${size}`} style={{ width: "100%", maxWidth: 220, display: "block", margin: "0 auto" }}>
        {slices.map((s, i) => s.sweep > 0.01 && (
          <path key={i}
            d={`M ${cx} ${cy} L ${s.x1} ${s.y1} A ${r} ${r} 0 ${s.large} 1 ${s.x2} ${s.y2} Z`}
            fill={s.color} opacity={0.85} stroke="#0f1117" strokeWidth={2}
            onClick={() => setDrillDown({ items: s.items, label: s.name || s.label, color: s.color })}
            style={{ cursor: "pointer" }}
          />
        ))}
        <circle cx={cx} cy={cy} r={40} fill="#0f1117" />
        <text x={cx} y={cy-6} textAnchor="middle" fill="#e8eaf0" fontSize={11} fontWeight="600">{fmt(total)}</text>
        <text x={cx} y={cy+10} textAnchor="middle" fill="#8b90a0" fontSize={9}>total</text>
      </svg>
    );
  }

  // ── Bar Chart ──
  function BarChart({ data }) {
    const maxVal = Math.max(...data.map(d => d.sum), 1);
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {data.map((d, i) => (
          <div key={i} style={{ cursor: "pointer" }} onClick={() => setDrillDown({ items: d.items, label: d.name || d.label, color: d.color })}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 3 }}>
              <span style={{ fontSize: 12, color: p.text }}>{"·"} {d.name || d.label}</span>
              <span style={{ fontSize: 12, fontWeight: 600, color: p.text }}>{fmt(d.sum)} <span style={{ color: p.muted, fontWeight: 400 }}>({d.pct}%)</span></span>
            </div>
            <div style={{ background: p.border, borderRadius: 4, height: 10 }}>
              <div style={{ width: `${(d.sum/maxVal)*100}%`, background: d.color, borderRadius: 4, height: 10, transition: "width .4s" }} />
            </div>
          </div>
        ))}
      </div>
    );
  }

  function ChartSection({ title, data }) {
    if (!data.length) return null;
    return (
      <div className="stat-card" style={{ marginBottom: 12 }}>
        <div style={{ fontSize: 13, fontWeight: 600, color: p.textMuted, marginBottom: 14, textTransform: "uppercase", letterSpacing: ".5px" }}>{title}</div>
        {chartType === "pie" ? <PieChart data={data} /> : <BarChart data={data} />}
        {chartType === "pie" && (
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 12 }}>
            {data.map((d, i) => (
              <span key={i} onClick={() => setDrillDown({ items: d.items, label: d.name || d.label, color: d.color })}
                style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 11, color: p.textMuted, cursor: "pointer" }}>
                <span style={{ width: 8, height: 8, borderRadius: 2, background: d.color, display: "inline-block" }}></span>
                {d.name || d.label} {d.pct}%
              </span>
            ))}
          </div>
        )}
        <div style={{ fontSize: 10, color: p.muted, marginTop: 8 }}>Tap a bar or slice to see transactions</div>
      </div>
    );
  }

  // ── Drill-down modal ──
  if (drillDown) {
    return (
      <div>
        <button onClick={() => setDrillDown(null)} style={{ background: "none", border: `1px solid ${p.border}`, color: p.textMuted, borderRadius: 8, padding: "8px 14px", fontSize: 13, marginBottom: 14, display: "flex", alignItems: "center", gap: 6 }}>
          ← Back to Breakdown
        </button>
        <div style={{ fontSize: 16, fontWeight: 600, color: drillDown.color, marginBottom: 4 }}>{drillDown.label}</div>
        <div style={{ fontSize: 12, color: p.muted, marginBottom: 14 }}>
          {drillDown.items.length} transactions · {fmt(drillDown.items.reduce((s,t)=>s+t.amount,0))}
        </div>
        {drillDown.items.sort((a,b) => new Date(b.date)-new Date(a.date)).map((t, i) => (
          <div key={i} style={{ background: p.card, border: `1px solid ${p.border}`, borderRadius: 8, padding: "10px 12px", marginBottom: 6 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <span style={{ fontSize: 13, color: p.text, flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", paddingRight: 8 }}>{t.description}</span>
              <span style={{ fontSize: 13, fontWeight: 700, color: p.red, flexShrink: 0 }}>{fmt(t.amount)}</span>
            </div>
            <div style={{ fontSize: 11, color: p.muted, marginTop: 4 }}>{t.date} · {ACCOUNTS.find(a=>a.id===t.account)?.name || t.account}</div>
          </div>
        ))}
      </div>
    );
  }

  // Credits (refunds, income)
  const credits = txns.filter(t => t.amount < 0);
  const totalCredits = credits.reduce((s,t) => s + Math.abs(t.amount), 0);
  const [showCredits, setShowCredits] = useState(false);

  return (
    <div>
      <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
        <div className="stat-card" style={{ flex: 1 }}>
          <div style={{ fontSize: 11, color: p.muted, marginBottom: 4, textTransform: "uppercase", letterSpacing: ".5px" }}>Spent</div>
          <div style={{ fontSize: 22, fontWeight: 700, color: p.red }}>{fmt(grandTotal)}</div>
          <div style={{ fontSize: 11, color: p.muted, marginTop: 2 }}>{txns.filter(t=>t.amount>0).length} transactions</div>
        </div>
        <div className="stat-card" style={{ flex: 1 }}>
          <div style={{ fontSize: 11, color: p.muted, marginBottom: 4, textTransform: "uppercase", letterSpacing: ".5px" }}>Credits</div>
          <div style={{ fontSize: 22, fontWeight: 700, color: p.green }}>{fmt(totalCredits)}</div>
          <div style={{ fontSize: 11, color: p.muted, marginTop: 2 }}>{credits.length} credits</div>
        </div>
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
        <div className="stat-card" style={{ flex: 1 }}>
          <div style={{ fontSize: 11, color: p.muted, textTransform: "uppercase", letterSpacing: ".5px" }}>Net</div>
          <div style={{ fontSize: 22, fontWeight: 700, color: grandTotal - totalCredits > 0 ? p.red : p.green }}>{fmt(grandTotal - totalCredits)}</div>
        </div>
        <div className="stat-card" style={{ flex: 1 }}>
          <div style={{ fontSize: 11, color: "#f39c12", marginBottom: 2, textTransform: "uppercase", letterSpacing: ".5px", fontSize: 11 }}>Untagged</div>
          <div style={{ fontSize: 22, fontWeight: 700, color: "#f39c12" }}>{fmt(untaggedTxns.reduce((s,t)=>s+t.amount,0))}</div>
          <div style={{ fontSize: 11, color: p.muted, marginTop: 2 }}>{untaggedTxns.length} transactions</div>
        </div>
      </div>

      {/* Credits / refunds section */}
      {credits.length > 0 && (
        <div className="stat-card" style={{ marginBottom: 12 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: p.green, textTransform: "uppercase", letterSpacing: ".5px" }}>💰 Credits & Refunds</div>
            <button onClick={() => setShowCredits(s => !s)} style={{ background: "none", border: `1px solid ${p.border}`, color: p.muted, borderRadius: 6, padding: "3px 10px", fontSize: 11 }}>{showCredits ? "Hide ▲" : "Show ▼"}</button>
          </div>
          {showCredits && (
            <div style={{ marginTop: 10 }}>
              {credits.sort((a,b) => new Date(b.date)-new Date(a.date)).map((t,i) => (
                <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "7px 0", borderBottom: `1px solid ${p.border}` }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 12, color: p.text, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{t.description}</div>
                    <div style={{ fontSize: 10, color: p.muted }}>{t.date} · {ACCOUNTS.find(a=>a.id===t.account)?.name || t.account}</div>
                  </div>
                  <span style={{ fontSize: 13, fontWeight: 700, color: p.green, flexShrink: 0, marginLeft: 8 }}>+{fmt(Math.abs(t.amount))}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {/* Chart toggle */}
      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
        <button onClick={() => setChartType("bar")} style={{ flex: 1, padding: "8px", borderRadius: 8, border: `1px solid ${chartType==="bar" ? p.accent : p.border}`, background: chartType==="bar" ? p.accent+"22" : "none", color: chartType==="bar" ? p.accent : p.muted, fontSize: 13, fontWeight: 500 }}>
          📊 Bar Chart
        </button>
        <button onClick={() => setChartType("pie")} style={{ flex: 1, padding: "8px", borderRadius: 8, border: `1px solid ${chartType==="pie" ? p.accent : p.border}`, background: chartType==="pie" ? p.accent+"22" : "none", color: chartType==="pie" ? p.accent : p.muted, fontSize: 13, fontWeight: 500 }}>
          🥧 Pie Chart
        </button>
      </div>

      <ChartSection title="By Tag" data={byTag} />
      <ChartSection title="By Account" data={byAccount} />
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────────────────────
function BudgetTracker() {
  const [tab, setTab] = useState(0);
  const [syncing, setSyncing] = useState(false);
  const [txns, saveTxn, deleteTxn, updateTxn, txnsLoaded, reloadTxns] = useCloud("transactions");
  const [cashTxns, saveCash, deleteCash, updateCash, , reloadCash] = useCloud("cash_transactions");

  const allTxns = [...txns, ...cashTxns].sort((a, b) => new Date(b.date) - new Date(a.date));

  // Time filter
  const [view, setView] = useState(0); // 0=month,1=year,2=custom,3=all
  const now = new Date();
  const [selMonth, setSelMonth] = useState(now.getMonth());
  const [selYear, setSelYear] = useState(now.getFullYear());
  const [customStart, setCustomStart] = useState("");
  const [customEnd, setCustomEnd] = useState("");
  const [filterAccount, setFilterAccount] = useState("all");
  const [filterTag, setFilterTag] = useState("all");
  const [filterMin, setFilterMin] = useState("");
  const [filterMax, setFilterMax] = useState("");
  const [showCreditsOnly, setShowCreditsOnly] = useState(false);
  const [showUntaggedOnly, setShowUntaggedOnly] = useState(false);
  const [expandedTxnId, setExpandedTxnId] = useState(null);
  const [searchQuery, setSearchQuery] = useState("");

  // Upload state
  const [uploadAccount, setUploadAccount] = useState("jessica_chase");
  const [uploadPreview, setUploadPreview] = useState([]);
  const [rawCSVText, setRawCSVText] = useState("");
  const [dragOver, setDragOver] = useState(false);
  const [uploadMsg, setUploadMsg] = useState("");
  const [showClearConfirm, setShowClearConfirm] = useState(false);

  // Cash form
  const [cashForm, setCashForm] = useState({ date: today(), description: "", amount: "", tag: "untagged", notes: "" });

  const withSync = async (fn) => { setSyncing(true); try { await fn(); } finally { setSyncing(false); } };

  function filterTxns(list) {
    // Keyword search bypasses ALL other filters
    if (searchQuery.trim()) {
      const q = searchQuery.trim().toLowerCase();
      return list.filter(t => t.description.toLowerCase().includes(q) || (t.notes && t.notes.toLowerCase().includes(q)));
    }
    let filtered = list;
    if (filterAccount !== "all") filtered = filtered.filter(t => t.account === filterAccount);
    if (filterTag !== "all") filtered = filtered.filter(t => t.tag === filterTag || t.tag2 === filterTag);
    if (view === 0) filtered = filtered.filter(t => { const d = new Date(t.date); return d.getMonth() === selMonth && d.getFullYear() === selYear; });
    else if (view === 1) filtered = filtered.filter(t => new Date(t.date).getFullYear() === selYear);
    else if (view === 2 && customStart && customEnd) filtered = filtered.filter(t => t.date >= customStart && t.date <= customEnd);
    if (showCreditsOnly) filtered = filtered.filter(t => t.amount < 0);
    else if (showUntaggedOnly) filtered = filtered.filter(t => !t.tag || t.tag === "untagged");
    else if (filterMin !== "") filtered = filtered.filter(t => t.amount >= parseFloat(filterMin));
    if (!showCreditsOnly && !showUntaggedOnly && filterMax !== "") filtered = filtered.filter(t => t.amount <= parseFloat(filterMax));
    return filtered;
  }

  const filtered = filterTxns(allTxns);

  function processCSV(text, accountId, existingTxns = []) {
    const parser = autoDetectParser(text);
    const rows = parser(text);
    // Build a dedup key set from existing transactions
    const existingKeys = new Set(existingTxns.map(t => `${t.account}_${t.date}_${String(t.amount)}_${t.description.slice(0,30).toLowerCase()}`));
    const dupeCount = { count: 0 };
    const results = rows
      .filter(r => !SKIP_KEYWORDS.some(k => r.description.toLowerCase().includes(k)))
      .map(r => {
        const dupKey = `${accountId}_${r.date}_${String(r.amount)}_${r.description.slice(0,30).toLowerCase()}`;
        const isDupe = existingKeys.has(dupKey);
        if (isDupe) dupeCount.count++;
        return {
          id: `${accountId}_${r.date}_${r.description.slice(0,20).replace(/\s/g,"")}_${Math.abs(r.amount).toFixed(0)}_${Math.random().toString(36).slice(2,4)}`,
          date: r.date,
          description: r.description,
          amount: r.amount,
          account: accountId,
              tag: autoTag(r.description),
          notes: "",
          _isDupe: isDupe,
        };
      });
    return { results, dupeCount: dupeCount.count };
  }

  function handleFile(file) {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const text = e.target.result;
        setRawCSVText(text);
        const { results, dupeCount } = processCSV(text, uploadAccount, allTxns);
        const newOnes = results.filter(r => !r._isDupe);
        const dupes = results.filter(r => r._isDupe);
        setUploadPreview(newOnes);
        if (dupeCount > 0) {
          setUploadMsg(`Found ${results.length} transactions — ${newOnes.length} new, ${dupeCount} already imported (skipped). Review below then click Import.`);
        } else {
          setUploadMsg(`Found ${newOnes.length} transactions. Review and confirm account below, then click Import.`);
        }
      } catch(err) {
        setUploadMsg("Could not read file. Make sure it's a CSV from your bank.");
      }
    };
    reader.readAsText(file);
  }

  function reprocessWithAccount(accountId) {
    if (!rawCSVText) return;
    try {
      const { results, dupeCount } = processCSV(rawCSVText, accountId, allTxns);
      const newOnes = results.filter(r => !r._isDupe);
      setUploadPreview(newOnes);
      if (dupeCount > 0) setUploadMsg(`${newOnes.length} new transactions (${dupeCount} duplicates skipped).`);
    } catch(err) {}
  }

  async function importAll() {
    setSyncing(true);
    const total = uploadPreview.length;
    setUploadMsg(`Importing ${total} transactions...`);
    try {
      await db.bulkUpsert("transactions", uploadPreview);
      await reloadTxns();
      setSyncing(false);
      setUploadPreview([]);
      setUploadMsg(`✅ Imported ${total} transactions!`);
      setTab(0);
    } catch(err) {
      setSyncing(false);
      setUploadMsg("❌ Import failed. Please try again.");
    }
  }

  const years = [];
  const minYear = allTxns.length ? Math.min(...allTxns.map(t => new Date(t.date).getFullYear())) : now.getFullYear();
  for (let y = minYear; y <= now.getFullYear() + 1; y++) years.push(y);

  return (
    <>
      <style>{css}</style>
      <div style={{ minHeight: "100vh", background: p.bg }}>

        {/* Header */}
        <div style={{ background: p.surface, borderBottom: `1px solid ${p.border}`, padding: "14px 16px" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ fontSize: 20, fontWeight: 700, color: p.text }}>Budget Tracker</div>
              <div style={{ fontSize: 11, color: p.muted, marginTop: 1, letterSpacing: "1px", textTransform: "uppercase" }}>Household Spending</div>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11 }}>
              <span className="sync-dot" style={{ background: syncing ? p.amber : p.green }}></span>
              <span style={{ color: p.muted }}>{syncing ? "Saving…" : "Synced"}</span>
            </div>
          </div>
        </div>

        {/* Tabs */}
        <div style={{ display: "flex", background: p.surface, borderBottom: `1px solid ${p.border}`, overflowX: "auto" }}>
          {TABS.map((t, i) => (
            <button key={i} onClick={() => setTab(i)} style={{ padding: "10px 13px", fontSize: 12, fontWeight: 500, whiteSpace: "nowrap", background: "none", border: "none", borderBottom: tab === i ? `2px solid ${p.accent}` : "2px solid transparent", color: tab === i ? p.accent : p.muted, transition: "all .15s" }}>{t}</button>
          ))}
        </div>

        {/* Time & Account Filters — show on Transactions & Breakdown */}
        {(tab === 0 || tab === 1) && (
          <div style={{ background: p.surface, borderBottom: `1px solid ${p.border}`, padding: "10px 16px" }}>

            {/* Keyword search — shown on transactions tab only, bypasses all filters */}
            {tab === 0 && (
              <div style={{ marginBottom: 10, position: "relative" }}>
                <input
                  placeholder="Search transactions... (bypasses all filters)"
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  style={{ paddingRight: searchQuery ? 32 : 12, fontSize: 13 }}
                />
                {searchQuery && (
                  <button onClick={() => setSearchQuery("")}
                    style={{ position: "absolute", right: 8, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", color: p.muted, fontSize: 16, lineHeight: 1, cursor: "pointer" }}>
                    ×
                  </button>
                )}
                {searchQuery && (
                  <div style={{ fontSize: 10, color: p.muted, marginTop: 3 }}>
                    Showing all time · all accounts · all tags — keyword match only
                  </div>
                )}
              </div>
            )}

            {/* View selector — hidden when search active */}
            {!searchQuery && (
            <div>
              <div style={{ display: "flex", gap: 6, overflowX: "auto", marginBottom: 8 }}>
                {VIEWS.map((v, i) => (
                  <button key={i} className="view-btn" onClick={() => setView(i)}
                    style={{ background: view === i ? p.accent : "none", borderColor: view === i ? p.accent : p.border, color: view === i ? "#fff" : p.muted }}>
                    {v}
                  </button>
                ))}
              </div>

            {/* Month picker */}
            {view === 0 && (
              <div style={{ display: "flex", gap: 8 }}>
                <select value={selMonth} onChange={e => setSelMonth(+e.target.value)} style={{ flex: 1 }}>
                  {Array.from({ length: 12 }, (_, i) => <option key={i} value={i}>{monthName(i)}</option>)}
                </select>
                <select value={selYear} onChange={e => setSelYear(+e.target.value)} style={{ flex: 1 }}>
                  {years.map(y => <option key={y}>{y}</option>)}
                </select>
              </div>
            )}

            {/* Year picker */}
            {view === 1 && (
              <select value={selYear} onChange={e => setSelYear(+e.target.value)}>
                {years.map(y => <option key={y}>{y}</option>)}
              </select>
            )}

            {/* Custom range */}
            {view === 2 && (
              <div style={{ display: "grid", gridTemplateColumns: "1fr auto 1fr", gap: 8, alignItems: "center" }}>
                <input type="date" value={customStart} onChange={e => setCustomStart(e.target.value)} />
                <span style={{ color: p.muted, fontSize: 13 }}>→</span>
                <input type="date" value={customEnd} onChange={e => setCustomEnd(e.target.value)} />
              </div>
            )}

            {/* Account filter */}
            <div style={{ marginTop: 8 }}>
              <select value={filterAccount} onChange={e => setFilterAccount(e.target.value)}>
                <option value="all">All Accounts</option>
                {ACCOUNTS.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
              </select>
            </div>

            {/* Tag filter */}
            <div style={{ marginTop: 8 }}>
              <select value={filterTag} onChange={e => setFilterTag(e.target.value)}>
                <option value="all">All Tags</option>
                {TAGS.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
              </select>
            </div>

            {/* Credits toggle */}
            <div style={{ marginTop: 8 }}>
              <button onClick={() => { setShowCreditsOnly(s => !s); setFilterMin(""); setFilterMax(""); setShowUntaggedOnly(false); }}
                style={{ width: "100%", padding: "8px", borderRadius: 8, border: `1px solid ${showCreditsOnly ? p.green : p.border}`, background: showCreditsOnly ? p.green+"22" : "none", color: showCreditsOnly ? p.green : p.muted, fontSize: 13, fontWeight: showCreditsOnly ? 600 : 400 }}>
                {showCreditsOnly ? "Showing Credits Only — tap to clear" : "Show Credits Only"}
              </button>
            </div>

            {/* Untagged filter */}
            <div style={{ marginTop: 8 }}>
              <button onClick={() => { setShowUntaggedOnly(s => !s); setShowCreditsOnly(false); }}
                style={{ width: "100%", padding: "8px", borderRadius: 8, border: `1px solid ${showUntaggedOnly ? "#f39c12" : p.border}`, background: showUntaggedOnly ? "#f39c1222" : "none", color: showUntaggedOnly ? "#f39c12" : p.muted, fontSize: 13, fontWeight: showUntaggedOnly ? 600 : 400 }}>
                {showUntaggedOnly ? `Showing Untagged Only (${allTxns.filter(t=>!t.tag||t.tag==="untagged").length}) — tap to clear` : `Show Untagged Only (${allTxns.filter(t=>!t.tag||t.tag==="untagged").length})`}
              </button>
            </div>

            {/* Amount range filter */}
            <div style={{ marginTop: 8 }}>
              <div style={{ fontSize: 10, color: p.muted, marginBottom: 4, textTransform: "uppercase", letterSpacing: ".5px", fontWeight: 600 }}>Amount Range</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr auto 1fr", gap: 6, alignItems: "center" }}>
                <input type="number" placeholder="$ Min" value={filterMin} onChange={e => setFilterMin(e.target.value)} style={{ padding: "6px 8px", fontSize: 13 }} />
                <span style={{ color: p.muted, fontSize: 13, textAlign: "center" }}>–</span>
                <input type="number" placeholder="$ Max" value={filterMax} onChange={e => setFilterMax(e.target.value)} style={{ padding: "6px 8px", fontSize: 13 }} />
              </div>
              {(filterMin || filterMax) && (
                <button onClick={() => { setFilterMin(""); setFilterMax(""); }} style={{ marginTop: 4, background: "none", border: "none", color: p.muted, fontSize: 11, textDecoration: "underline" }}>Clear range</button>
              )}
            </div>
            </div>
            )} {/* end !searchQuery */}
          </div>
        )}

        <div style={{ padding: "14px 16px", maxWidth: 600, margin: "0 auto" }}>

          {/* TRANSACTIONS */}
          {tab === 0 && (
            <div>
              <div style={{ fontSize: 12, color: p.muted, marginBottom: 10 }}>
                {filtered.length} transactions · {fmt(filtered.filter(t=>t.amount>0).reduce((s,t)=>s+t.amount,0))} spent
              </div>
              {!txnsLoaded && <div style={{ textAlign: "center", color: p.muted, padding: "40px 0" }}>Loading…</div>}
              {txnsLoaded && filtered.length === 0 && (
                <div style={{ textAlign: "center", padding: "40px 0" }}>
                  <div style={{ fontSize: 36, marginBottom: 8 }}>💳</div>
                  <div style={{ color: p.muted, fontSize: 14 }}>No transactions for this period</div>
                  <div style={{ color: p.muted, fontSize: 12, marginTop: 4 }}>Upload a CSV or add a cash transaction</div>
                </div>
              )}
              {filtered.map(t => (
                <TxnRow key={t.id} txn={t}
                  expanded={expandedTxnId === t.id}
                  onToggle={(id) => setExpandedTxnId(prev => prev === id ? null : id)}
                  onUpdate={(id, changes) => withSync(() => cashTxns.find(c=>c.id===id) ? updateCash(id, changes) : updateTxn(id, changes))}
                  onDelete={(id) => withSync(() => cashTxns.find(c=>c.id===id) ? deleteCash(id) : deleteTxn(id))}
                  onApplyToAll={(desc, tag, exceptId, isRetag) => {
                    const root = cleanMerchant(desc);
                    const tagLabel = TAGS.find(t=>t.id===tag)?.label;
                    // For retag: match all with same root (tagged or not). For new tag: only untagged.
                    const matches = allTxns.filter(t =>
                      t.id !== exceptId &&
                      merchantMatch(t.description, desc) &&
                      (isRetag ? true : (!t.tag || t.tag === "untagged"))
                    );
                    if (matches.length === 0) return;
                    const prompt = isRetag
                      ? `${matches.length} other transaction${matches.length > 1 ? "s" : ""} matching "${root}" found.\n\nChange ALL to "${tagLabel}"?`
                      : `${matches.length} untagged transaction${matches.length > 1 ? "s" : ""} matching "${root}" found.\n\nApply "${tagLabel}" to all?`;
                    if (window.confirm(prompt)) {
                      matches.forEach(t => withSync(() => cashTxns.find(c=>c.id===t.id) ? updateCash(t.id, { tag }) : updateTxn(t.id, { tag })));
                    }
                  }}
                />
              ))}
            </div>
          )}

          {/* BREAKDOWN */}
          {tab === 1 && <Breakdown txns={filtered} />}

          {/* ADD CASH */}
          {tab === 2 && (
            <div>
              <div style={{ fontSize: 13, color: p.muted, marginBottom: 14 }}>Log a cash purchase or manual transaction</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                <div><Label>Date</Label><input type="date" value={cashForm.date} onChange={e => setCashForm(p => ({...p, date: e.target.value}))} /></div>
                <div><Label>Description</Label><input placeholder="What was it?" value={cashForm.description} onChange={e => setCashForm(p => ({...p, description: e.target.value}))} /></div>
                <div><Label>Amount ($)</Label><input type="number" placeholder="0.00" step="0.01" value={cashForm.amount} onChange={e => setCashForm(p => ({...p, amount: e.target.value}))} /></div>
                
                <div><Label>Tag</Label><TagButtons value={cashForm.tag} onChange={v => setCashForm(p => ({...p, tag: v}))} /></div>
                <div><Label>Notes</Label><textarea placeholder="Optional notes..." value={cashForm.notes} onChange={e => setCashForm(p => ({...p, notes: e.target.value}))} /></div>
                <button onClick={async () => {
                  if (!cashForm.description || !cashForm.amount) return;
                  await withSync(() => saveCash({ ...cashForm, id: Date.now(), account: "cash", amount: parseFloat(cashForm.amount) }));
                  setCashForm({ date: today(), description: "", amount: "", tag: "untagged", notes: "" });
                  setTab(0);
                }} style={{ background: p.accent, color: "#fff", border: "none", borderRadius: 8, padding: "12px", fontSize: 14, fontWeight: 600 }}>
                  Save Transaction
                </button>
              </div>
            </div>
          )}

          {/* UPLOAD */}
          {tab === 3 && (
            <div>
              <div style={{ marginBottom: 12 }}>
                <Label>Account — select BEFORE or AFTER dropping file</Label>
                <select value={uploadAccount} onChange={e => { setUploadAccount(e.target.value); reprocessWithAccount(e.target.value); }}
                  style={{ borderColor: ACCOUNTS.find(a=>a.id===uploadAccount)?.color, borderWidth: 2 }}>
                  {ACCOUNTS.filter(a => a.id !== "cash").map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                </select>
              </div>

              <div
                className={`drop-zone${dragOver ? " drag-over" : ""}`}
                onClick={() => { const el = document.getElementById("csv-input"); el.value=""; el.click(); }}
                onDragOver={e => { e.preventDefault(); setDragOver(true); }}
                onDragLeave={() => setDragOver(false)}
                onDrop={e => { e.preventDefault(); setDragOver(false); const f = e.dataTransfer.files[0]; if (f) handleFile(f); }}
              >
                <div style={{ fontSize: 36, marginBottom: 8 }}>📂</div>
                <div style={{ color: p.text, fontSize: 14, fontWeight: 500 }}>Drop CSV file here</div>
                <div style={{ color: p.muted, fontSize: 12, marginTop: 4 }}>or tap to browse</div>
                <input id="csv-input" type="file" accept=".csv" style={{ display: "none" }} onChange={e => { if (e.target.files[0]) handleFile(e.target.files[0]); }} />
              </div>

              {uploadMsg && (
                <div style={{ marginTop: 12, padding: "10px 14px", background: p.card, borderRadius: 8, fontSize: 13, color: p.textMuted, border: `1px solid ${p.border}` }}>
                  {uploadMsg}
                </div>
              )}

              {uploadPreview.length > 0 && (
                <div style={{ marginTop: 14 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                    <div style={{ fontSize: 13, color: p.muted }}>{uploadPreview.length} transactions to import</div>
                    <div style={{ display: "flex", gap: 8 }}>
                      <button onClick={() => { setUploadPreview([]); setUploadMsg(""); }} style={{ background: "none", border: `1px solid ${p.border}`, color: p.muted, borderRadius: 6, padding: "6px 12px", fontSize: 12 }}>Cancel</button>
                      <button onClick={importAll} style={{ background: p.accent, color: "#fff", border: "none", borderRadius: 6, padding: "6px 14px", fontSize: 12, fontWeight: 600 }}>Import All</button>
                    </div>
                  </div>
                  <div style={{ maxHeight: 400, overflowY: "auto" }} className="scrollbar">
                    {uploadPreview.map((t, i) => (
                      <div key={i} style={{ background: p.card, border: `1px solid ${p.border}`, borderRadius: 8, padding: "10px 12px", marginBottom: 6 }}>
                        <div style={{ display: "flex", justifyContent: "space-between" }}>
                          <span style={{ fontSize: 13, color: p.text, flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{t.description}</span>
                          <span style={{ fontSize: 13, fontWeight: 600, color: p.red, flexShrink: 0, marginLeft: 8 }}>{fmt(t.amount)}</span>
                        </div>
                        <div style={{ display: "flex", gap: 6, marginTop: 4, flexWrap: "wrap" }}>
                          <span style={{ fontSize: 11, color: p.muted }}>{t.date}</span>
                            <TagPill tagId={t.tag} />
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <div style={{ marginTop: 20, background: p.card, borderRadius: 10, padding: 14, border: `1px solid ${p.border}` }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: p.textMuted, marginBottom: 8 }}>How to download your CSV</div>
                <div style={{ fontSize: 12, color: p.muted, lineHeight: 1.7 }}>
                  <div style={{ marginBottom: 6 }}><strong style={{ color: p.textMuted }}>Chase:</strong> chase.com → Accounts → Download → CSV</div>
                  <div style={{ marginBottom: 6 }}><strong style={{ color: p.textMuted }}>Capital One:</strong> capitalone.com → Account → Download Transactions → CSV</div>
                  <div><strong style={{ color: p.textMuted }}>Alliant:</strong> alliantcreditunion.org → Accounts → Export → CSV</div>
                </div>
              </div>
            </div>
          )}



          {/* MANAGE */}
          {tab === 4 && (
            <div>
              <div style={{ fontSize: 16, fontWeight: 600, color: p.text, marginBottom: 16 }}>Manage Data</div>

              {/* Clear by account */}
              <div style={{ background: p.card, border: `1px solid ${p.border}`, borderRadius: 12, padding: 16, marginBottom: 12 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: p.textMuted, marginBottom: 12, textTransform: "uppercase", letterSpacing: ".5px" }}>Clear Transactions by Account</div>
                <div style={{ fontSize: 12, color: p.muted, marginBottom: 12 }}>This permanently deletes all transactions for the selected account. Your other accounts are not affected.</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {ACCOUNTS.map(acc => (
                    <button key={acc.id} onClick={async () => {
                      if (!window.confirm(`Delete ALL transactions for ${acc.name}?`)) return;
                      setSyncing(true);
                      const mainIds = txns.filter(t => t.account === acc.id).map(t => String(t.id));
                      const cashIds = cashTxns.filter(t => t.account === acc.id).map(t => String(t.id));
                      if (mainIds.length) await db.bulkDelete("transactions", mainIds);
                      if (cashIds.length) await db.bulkDelete("cash_transactions", cashIds);
                      await reloadTxns();
                      await reloadCash();
                      setSyncing(false);
                    }} style={{ background: "none", border: `1px solid ${acc.color}44`, color: acc.color, borderRadius: 8, padding: "10px 14px", fontSize: 13, fontWeight: 500, textAlign: "left" }}>
                      Clear {acc.name} ({allTxns.filter(t=>t.account===acc.id).length} transactions)
                    </button>
                  ))}
                </div>
              </div>

              {/* Clear all */}
              <div style={{ background: p.card, border: `1px solid ${p.red}33`, borderRadius: 12, padding: 16, marginBottom: 12 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: p.red, marginBottom: 8, textTransform: "uppercase", letterSpacing: ".5px" }}>Clear All Data</div>
                <div style={{ fontSize: 12, color: p.muted, marginBottom: 12 }}>Permanently deletes every transaction from all accounts. Cannot be undone.</div>
                <button onClick={async () => {
                  if (!window.confirm("Delete ALL transactions from ALL accounts? This cannot be undone.")) return;
                  setSyncing(true);
                  await db.deleteAll("transactions");
                  await db.deleteAll("cash_transactions");
                  await reloadTxns();
                  await reloadCash();
                  setSyncing(false);
                }} style={{ background: p.red + "22", border: `1px solid ${p.red}`, color: p.red, borderRadius: 8, padding: "10px 14px", fontSize: 13, fontWeight: 600, width: "100%" }}>
                  Delete All Transactions
                </button>
              </div>

              {/* Stats */}
              <div style={{ background: p.card, border: `1px solid ${p.border}`, borderRadius: 12, padding: 16 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: p.textMuted, marginBottom: 12, textTransform: "uppercase", letterSpacing: ".5px" }}>Database Summary</div>
                {ACCOUNTS.map(acc => (
                  <div key={acc.id} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: `1px solid ${p.border}` }}>
                    <span style={{ fontSize: 13, color: p.textMuted }}>{acc.name}</span>
                    <span style={{ fontSize: 13, fontWeight: 600, color: acc.color }}>{allTxns.filter(t=>t.account===acc.id).length} transactions</span>
                  </div>
                ))}
                <div style={{ display: "flex", justifyContent: "space-between", padding: "8px 0 0 0" }}>
                  <span style={{ fontSize: 13, fontWeight: 600, color: p.text }}>Total</span>
                  <span style={{ fontSize: 13, fontWeight: 600, color: p.text }}>{allTxns.length} transactions</span>
                </div>
              </div>
            </div>
          )}
        </div>
      </div>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<BudgetTracker />);
  </script>
</body>
</html>
